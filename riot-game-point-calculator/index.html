            <p>

        <script>
            (function () {
                const GAMES = {
                    lol: {
                        unit: '聯盟幣',
                        denoms: [{
                            nt: 90,
                            coins: 380
                        }, {
                            nt: 150,
                            coins: 660
                        }, {
                            nt: 300,
                            coins: 1380
                        }, {
                            nt: 750,
                            coins: 3500
                        }, {
                            nt: 1490,
                            coins: 7050
                        }, {
                            nt: 2500,
                            coins: 12150
                        }, {
                            nt: 6800,
                            coins: 33500
                        }, {
                            nt: 12050,
                            coins: 60200
                        }]
                    },
                    valorant: {
                        unit: '特務幣',
                        denoms: [{
                            nt: 150,
                            coins: 460
                        }, {
                            nt: 300,
                            coins: 930
                        }, {
                            nt: 500,
                            coins: 1600
                        }, {
                            nt: 1000,
                            coins: 3300
                        }, {
                            nt: 1490,
                            coins: 5050
                        }, {
                            nt: 3000,
                            coins: 10600
                        }]
                    }
                };

                function fmt(n) {
                    return n.toLocaleString('en-US');
                }

                function solve(DENOMS, need) {
                    if (need <= 0) return {
                        cost: 0,
                        totalCoins: 0,
                        counts: DENOMS.map(() => 0)
                    };

                    const maxDenomCoins = Math.max(...DENOMS.map(d => d.coins));
                    const upper = need + maxDenomCoins - 1;
                    const dp = new Float64Array(upper + 1).fill(Infinity);
                    const choice = new Int32Array(upper + 1).fill(-1);
                    dp[0] = 0;

                    for (let i = 1; i <= upper; i++) {
                        for (let j = 0; j < DENOMS.length; j++) {
                            const d = DENOMS[j];
                            if (d.coins <= i && dp[i - d.coins] + d.nt < dp[i]) {
                                dp[i] = dp[i - d.coins] + d.nt;
                                choice[i] = j;
                            }
                        }
                    }

                    let best = Infinity,
                        bestI = -1;
                    for (let i = need; i <= upper; i++) {
                        if (dp[i] < best) {
                            best = dp[i];
                            bestI = i;
                        }
                    }

                    if (bestI === -1) return null;

                    const counts = DENOMS.map(() => 0);
                    let cur = bestI;
                    while (cur > 0) {
                        const j = choice[cur];
                        counts[j]++;
                        cur -= DENOMS[j].coins;
                    }

                    return {
                        cost: best,
                        totalCoins: bestI,
                        counts
                    };
                }

                // Minimizes number of purchases first, then cost as a tiebreaker.
                function solveMinCount(DENOMS, need) {
                    if (need <= 0) return {
                        cost: 0,
                        totalCoins: 0,
                        counts: DENOMS.map(() => 0)
                    };

                    const maxDenomCoins = Math.max(...DENOMS.map(d => d.coins));
                    const upper = need + maxDenomCoins - 1;
                    const dpCount = new Float64Array(upper + 1).fill(Infinity);
                    const dpCost = new Float64Array(upper + 1).fill(Infinity);
                    const choice = new Int32Array(upper + 1).fill(-1);
                    dpCount[0] = 0;
                    dpCost[0] = 0;

                    for (let i = 1; i <= upper; i++) {
                        for (let j = 0; j < DENOMS.length; j++) {
                            const d = DENOMS[j];
                            if (d.coins <= i) {
                                const candCount = dpCount[i - d.coins] + 1;
                                const candCost = dpCost[i - d.coins] + d.nt;
                                if (candCount < dpCount[i] || (candCount === dpCount[i] && candCost < dpCost[i])) {
                                    dpCount[i] = candCount;
                                    dpCost[i] = candCost;
                                    choice[i] = j;
                                }
                            }
                        }
                    }

                    let bestCount = Infinity,
                        bestCost = Infinity,
                        bestI = -1;
                    for (let i = need; i <= upper; i++) {
                        if (dpCount[i] < bestCount || (dpCount[i] === bestCount && dpCost[i] < bestCost)) {
                            bestCount = dpCount[i];
                            bestCost = dpCost[i];
                            bestI = i;
                        }
                    }

                    if (bestI === -1) return null;

                    const counts = DENOMS.map(() => 0);
                    let cur = bestI;
                    while (cur > 0) {
                        const j = choice[cur];
                        counts[j]++;
                        cur -= DENOMS[j].coins;
                    }

                    return {
                        cost: bestCost,
                        totalCoins: bestI,
                        counts
                    };
                }

                function setupCalculator(key, config) {
                    const DENOMS = config.denoms;
                    const UNIT = config.unit;

                    const priceTableEl = document.getElementById(`priceTable-${key}`);
                    [...DENOMS].sort((a, b) => b.nt - a.nt).forEach(d => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${fmt(d.nt)}</td><td>${fmt(d.coins)}</td>`;
                        priceTableEl.appendChild(tr);
                    });

                    const targetEl = document.getElementById(`target-${key}`);
                    const balanceEl = document.getElementById(`balance-${key}`);
                    const useBalanceEl = document.getElementById(`useBalance-${key}`);
                    const minCountEl = document.getElementById(`minCount-${key}`);
                    const resultCard = document.getElementById(`resultCard-${key}`);

                    function render() {
                        const targetVal = parseInt(targetEl.value, 10);

                        if (!targetVal || targetVal <= 0) {
                            resultCard.innerHTML = `<div class="error">請輸入有效的${UNIT}目標數量</div>`;
                            return;
                        }

                        const useBalance = useBalanceEl.checked;
                        const balanceVal = useBalance ? (parseInt(balanceEl.value, 10) || 0) : 0;
                        const need = Math.max(targetVal - balanceVal, 0);

                        let html = '';
                        if (useBalance) {
                            html += `<div class="summary">餘 <b>${fmt(balanceVal)}</b> 需購買 <b>${fmt(need)}</b> ${UNIT}</div>`;
                        }

                        if (need === 0) {
                            html += '<div class="empty">餘額已足夠，不需要購買</div>';
                            resultCard.innerHTML = html;
                            return;
                        }

                        const minCount = minCountEl.checked;
                        const result = minCount ? solveMinCount(DENOMS, need) : solve(DENOMS, need);
                        if (!result) {
                            resultCard.innerHTML = html + '<div class="error">無法計算購買方案</div>';
                            return;
                        }

                        const overshoot = result.totalCoins - need;
                        if (minCount && overshoot > 0) {
                            html += `<div class="hint"><div>⚠ 已選擇最少購買次數，會多得 <b>${fmt(overshoot)}</b> ${UNIT}（實際取得 ${fmt(result.totalCoins)}，超出目標 ${fmt(need)} 約 ${(overshoot / need * 100).toFixed(1)}%）</div></div>`;
                        }

                        const rows = DENOMS
                            .map((d, idx) => ({
                                ...d,
                                qty: result.counts[idx]
                            }))
                            .filter(r => r.qty > 0)
                            .sort((a, b) => b.nt - a.nt);

                        // expand into one row per individual purchase, so each can be checked off separately
                        const flatRows = [];
                        rows.forEach(r => {
                            for (let k = 0; k < r.qty; k++) {
                                flatRows.push({
                                    coins: r.coins,
                                    nt: r.nt
                                });
                            }
                        });

                        const purchaseCount = flatRows.length;

                        html += `
                        <table id="planTable-${key}">
                            <thead><tr><th class="bought-col">已買</th><th>${UNIT}</th><th>NT$</th></tr></thead>
                            <tbody>
                                ${flatRows.map((r, i) => `
                                <tr data-coins="${r.coins}" data-nt="${r.nt}">
                                    <td class="bought-col"><input type="checkbox" class="bought-check" data-idx="${i}"></td>
                                    <td>${fmt(r.coins)}</td>
                                    <td>${fmt(r.nt)}</td>
                                </tr>`).join('')}
                            </tbody>
                            <tfoot>
                                <tr><td></td><td id="tfootCoins-${key}">${fmt(result.totalCoins)}</td><td id="tfootNt-${key}">${fmt(result.cost)}</td></tr>
                            </tfoot>
                        </table>
                        <div class="result-final" id="resultFinal-${key}">
                            需分別購買 <b>${purchaseCount}</b> 次，花費 <b>NT$ ${fmt(result.cost)}</b>，取得 <b>${fmt(result.totalCoins)}</b> ${UNIT}
                        </div>
                    `;

                        resultCard.innerHTML = html;

                        const table = document.getElementById(`planTable-${key}`);
                        const tfootCoins = document.getElementById(`tfootCoins-${key}`);
                        const tfootNt = document.getElementById(`tfootNt-${key}`);
                        const resultFinal = document.getElementById(`resultFinal-${key}`);

                        function updateRemaining() {
                            const trs = [...table.querySelectorAll('tbody tr')];
                            let remCoins = 0,
                                remNt = 0,
                                remCount = 0,
                                boughtCount = 0;

                            trs.forEach(tr => {
                                const bought = tr.querySelector('.bought-check').checked;
                                const coins = parseInt(tr.dataset.coins, 10);
                                const nt = parseInt(tr.dataset.nt, 10);
                                tr.classList.toggle('bought', bought);
                                if (bought) {
                                    boughtCount++;
                                } else {
                                    remCoins += coins;
                                    remNt += nt;
                                    remCount++;
                                }
                            });

                            tfootCoins.textContent = fmt(remCoins);
                            tfootNt.textContent = fmt(remNt);

                            if (boughtCount === 0) {
                                resultFinal.innerHTML = `需分別購買 <b>${remCount}</b> 次，花費 <b>NT$ ${fmt(remNt)}</b>，取得 <b>${fmt(remCoins)}</b> ${UNIT}`;
                                return;
                            }

                            if (remCount === 0) {
                                resultFinal.innerHTML = '全部已購買完成';
                                return;
                            }

                            resultFinal.innerHTML = `已購買 <b>${boughtCount}</b> 次，尚需購買 <b>${remCount}</b> 次，花費 <b>NT$ ${fmt(remNt)}</b>，取得 <b>${fmt(remCoins)}</b> ${UNIT}`;
                        }

                        table.querySelectorAll('.bought-check').forEach(cb => {
                            cb.addEventListener('change', updateRemaining);
                        });
                    }

                    targetEl.addEventListener('input', render);
                    balanceEl.addEventListener('input', render);
                    useBalanceEl.addEventListener('change', render);
                    minCountEl.addEventListener('change', render);
                    render();
                }

                Object.keys(GAMES).forEach(key => setupCalculator(key, GAMES[key]));

                // tab switching
                const tabBtns = document.querySelectorAll('.tab-btn');
                const panels = document.querySelectorAll('.tab-panel');
                tabBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const target = btn.dataset.tab;
                        tabBtns.forEach(b => b.classList.toggle('active', b === btn));
                        panels.forEach(p => p.classList.toggle('active', p.dataset.panel === target));
                    });
                });
            })()
        </script>
    </body>

</html>
