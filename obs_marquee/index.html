<!DOCTYPE html>
<html lang="zh-TW">

    <head>
        <title>滿版跑馬燈 ◃ 網頁小工具 😺 tools.nekolive.net</title>
        <meta name="robots" content="noindex, nofollow" />
        <meta name="author" content="猫又おにぎり (https://haer0248.me/)" />

        <meta charset="utf-8" />
        <meta name="theme-color" content="#91beff" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />

        <link rel="icon" href="https://haer0248.me/favicon.ico" />
        <link rel="shortcut icon" href="https://haer0248.me/favicon.ico" />

        <link rel="stylesheet" href="https://widgets.nekolive.net/assets/bootstrap.min.css">
    </head>

    <body>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap');

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                display: flex !important;
                flex-direction: column !important;
            }

            .main-box {
                margin: 0 auto;
                width: 100%;
                font-weight: bold;
                position: fixed;
                align-items: center;
                box-shadow: 0px -2px 6px 0px rgb(34, 34, 34);
            }

            .main-content {
                display: flex;
                align-items: center;
                place-content: center;
            }

            marquee {
                display: flex;
            }

            #messages {
                left: 8%;
                width: 100%;
            }

            #time {
                display: none;
                width: 10%;
                min-width: 10%;
                text-align: center;
                word-break: break-all;
                white-space: nowrap;
            }

            marquee span {
                vertical-align: middle;
                margin-left: 20px;
            }

            #content {
                font-family: 'Noto Sans TC';
                font-size: 16px;
                margin-top: 30px;
                margin-bottom: 60px;
            }
        </style>

        <div class="container" id="content" style="display:none">
            <div class="card">
                <div class="card-body">
                    <div class="alert alert-info">
                        【幫助模式】幫助模式已自動啟用，在 OBS 使用此幫助將會自動隱藏，無需輸入任何設定。
                    </div>

                    <div class="mb-3 form-check">
                        <input class="form-check-input" type="checkbox" id="timer" name="timer">
                        <label class="form-check-label" for="timer">顯示時間</label>
                    </div>

                    <div class="mb-3">
                        <label for="position" class="form-label">跑馬燈位置</label>
                        <select name="position" id="position" class="form-control">
                            <option value="bottom">畫面底部</option>
                            <option value="top">畫面頂部</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">文字</label>
                        <p class="form-text">設定已改用雲端/本機儲存，不再受網址長度限制。</p>
                        <div id="text-list"></div>
                        <button class="btn btn-outline-success btn-sm" type="button" id="add-text">新增</button>
                    </div>

                    <div class="mb-3">
                        <label for="direction" class="form-label">文字滾動方向</label>
                        <select name="direction" id="direction" class="form-control">
                            <option value="left">由右至左</option>
                            <option value="right">由左至右</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">文字顏色</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <input type="color" class="form-control form-control-color" id="fontColorPicker" value="#000000">
                            </span>
                            <input type="text" class="form-control" id="font_color" name="font_color" placeholder="#000000">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">背景顏色（漸層）</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <input type="color" class="form-control form-control-color" id="colorPicker" value="#FD783A">
                            </span>
                            <input type="text" class="form-control" id="color" name="color" placeholder="#FD783A">
                            <span class="input-group-text">
                                <input type="color" class="form-control form-control-color" id="colorEndPicker" value="#FF9797">
                            </span>
                            <input type="text" class="form-control" id="color_end" name="color_end" placeholder="#FF9797">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="transparent" class="form-label">透明背景</label>
                        <select name="transparent" id="transparent" class="form-control">
                            <option value="false">否（預設）</option>
                            <option value="true">是</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="angle" class="form-label">背景漸層方向</label>
                        <select name="angle" id="angle" class="form-control">
                            <option value="0">由上至下</option>
                            <option value="270">由左至右（預設）</option>
                            <option value="90">由右至左</option>
                            <option value="180">由下至上</option>
                        </select>
                        <p class="form-text">您也可以自行調整網址中 <code>&amp;angle=&lt;數字&gt;</code> 來調整角度。</p>
                    </div>

                    <div class="mb-3">
                        <label for="font" class="form-label">字體</label>
                        <input type="text" class="form-control" id="font" name="font" placeholder="'Noto Sans TC', sans-serif">
                        <p class="form-text">您的電腦中必須要有字體檔案。</p>
                    </div>

                    <div class="mb-3">
                        <label for="size" class="form-label">大小</label>
                        <input type="text" class="form-control" id="size" name="size" placeholder="120%">
                        <p class="form-text">預設 120%，請輸入單位 <code>px</code>, <code>em</code> 或使用 <code>%</code></p>
                    </div>

                    <div class="mb-3">
                        <label for="scrollamount" class="form-label">滾動速度</label>
                        <input type="number" class="form-control" id="scrollamount" name="scrollamount" placeholder="6">
                        <p class="form-text">預設 6</p>
                    </div>

                    <button type="button" id="btn-generate" class="btn btn-success">儲存並套用設定</button>
                    <p class="form-text">按下後畫面預覽會立即更新；如果已經設定雲端同步，OBS 裡的來源畫面也會同步更新，不需要重新貼網址。</p>

                    <div class="mb-3">
                        <label for="obsUrl" class="form-label">OBS 瀏覽器來源網址（只需要貼一次）</label>
                        <div class="input-group">
                            <input type="text" class="form-control" readonly id="obsUrl">
                            <button class="btn btn-outline-secondary" type="button" id="toggleObsUrl">顯示</button>
                            <button class="btn btn-outline-secondary" type="button" id="copyObsUrl">複製</button>
                        </div>
                    </div>

                    <details class="mb-3">
                        <summary class="form-text" style="cursor:pointer;">進階：沒有設定雲端同步？改用傳統網址參數</summary>
                        <p class="form-text mt-2">傳統網址參數（受瀏覽器 <code>2,048</code> 字元長度限制）：</p>
                        <textarea class="form-control" readonly id="preview" cols="30" rows="3"></textarea>
                    </details>

                    <div id="syncPanelMount"></div>
                </div>
            </div>
        </div>

        <!-- Marquee display -->
        <div class="main-box" id="main-box">
            <div class="main-content">
                <div id="time"></div>
                <div id="messages" data-message></div>
            </div>
        </div>

        <script src="/static/shared/sync-server-config.js"></script>
        <script src="/static/shared/sync-store.js"></script>
        <script src="/static/shared/sync-panel.js"></script>

        <script>
            function hex2rgb(hex) {
                const default_ = 'rgb(0,0,0)';
                if (!hex) return default_;
                hex = hex.replace(/^#/, '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                if (hex.length !== 6) return default_;
                const r = parseInt(hex.slice(0, 2), 16);
                const g = parseInt(hex.slice(2, 4), 16);
                const b = parseInt(hex.slice(4, 6), 16);
                return `rgb(${r},${g},${b})`;
            }

            function sanitizeColor(val, fallback) {
                return /^#[0-9a-fA-F]{3}(?:[0-9a-fA-F]{3})?$/.test(val) ? val : fallback;
            }
            function sanitizeSize(val, fallback) {
                return /^\d+(\.\d+)?(px|em|rem|%)$/.test(val) ? val : fallback;
            }
            function sanitizeAngle(val, fallback) {
                const n = parseInt(val, 10);
                return (!isNaN(n) && n >= 0 && n <= 360) ? String(n) : fallback;
            }
            function sanitizeScrollAmount(val, fallback) {
                const n = parseInt(val, 10);
                return (!isNaN(n) && n > 0 && n <= 100) ? String(n) : fallback;
            }
            function sanitizeFont(val, fallback) {
                return /^[a-zA-Z0-9\u4e00-\u9fff ,'".\-_]+$/.test(val) ? val : fallback;
            }
            function sanitizeDirection(val) {
                return ['left', 'right'].includes(val) ? val : 'left';
            }

            const params = new URLSearchParams(window.location.search);
            const isOBS = /OBS/.test(navigator.userAgent) || params.get('obs') === '1';

            const DEFAULTS = {
                position: 'top',
                font: "'Noto Sans TC', sans-serif",
                timerEnable: '1',
                size: '120%',
                transparent: 'false',
                text: '預設文字。[BR]第二行[BR]更多行',
                font_color: '#000000',
                color: '#FD783A',
                color_end: '#FF9797',
                angle: '270',
                direction: 'left',
                scrollamount: '6'
            };

            function getLegacyUrlParams() {
                const out = {};
                let has = false;
                Object.keys(DEFAULTS).forEach(key => {
                    if (params.has(key)) { out[key] = params.get(key); has = true; }
                });
                return has ? out : null;
            }

            function setSelectValue(id, val) {
                const el = document.getElementById(id);
                if (!el) return;
                [...el.options].forEach(o => { o.selected = o.value === val; });
            }

            function addTextRow(value) {
                const div = document.createElement('div');
                div.className = 'input-group mb-1';
                div.innerHTML = `
                <input type="text" name="text-pre[]" class="form-control" placeholder="預設文字" value="${escHtml(value)}">
                <button class="btn btn-outline-danger" type="button" data-del>刪除</button>`;
                document.getElementById('text-list').appendChild(div);
            }

            function escHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            let clockStarted = false;

            function applyConfig(cfg) {
                const positionCss = cfg.position === 'bottom' ? 'bottom: 0;' : 'top: 0;';
                const font = sanitizeFont(cfg.font || '', DEFAULTS.font);
                const timerEnable = String(cfg.timerEnable) !== '0';
                const size = sanitizeSize(cfg.size || '', DEFAULTS.size);
                const transparent = String(cfg.transparent) === 'true';
                const text = (cfg.text || DEFAULTS.text).replace(/%5BBR%5D/gi, '[BR]');
                const font_color = sanitizeColor(cfg.font_color || '', DEFAULTS.font_color);
                const color = sanitizeColor(cfg.color || '', DEFAULTS.color);
                const color_end = sanitizeColor(cfg.color_end || '', DEFAULTS.color_end);
                const angle = sanitizeAngle(cfg.angle || '', DEFAULTS.angle);
                const direction = sanitizeDirection(cfg.direction || '');
                const scrollamount = sanitizeScrollAmount(cfg.scrollamount || '', DEFAULTS.scrollamount);

                const messages = text.split('[BR]');
                const show_color = transparent ? 'rgba(0,0,0,0)' : hex2rgb(color);
                const show_color_end = transparent ? 'rgba(0,0,0,0)' : hex2rgb(color_end);

                const mainBox = document.getElementById('main-box');
                mainBox.style.cssText = '';
                mainBox.style.backgroundImage = `linear-gradient(${angle}deg, ${show_color} 0%, ${show_color_end} 100%)`;
                mainBox.style.color = font_color;
                mainBox.style.fontSize = size;
                mainBox.style.fontFamily = font;
                mainBox.style.cssText += positionCss;

                document.getElementById('time').style.fontFamily = font;

                const messagesContainer = document.querySelector('.main-content');
                const oldMarquee = document.getElementById('messages');
                const marqueeEl = document.createElement('marquee');
                marqueeEl.setAttribute('direction', direction);
                marqueeEl.setAttribute('scrollamount', scrollamount);
                marqueeEl.setAttribute('id', 'messages');
                messages.forEach(msg => {
                    const span = document.createElement('span');
                    span.textContent = msg;
                    marqueeEl.appendChild(span);
                });
                oldMarquee.replaceWith(marqueeEl);

                const clock = document.getElementById('time');
                clock.style.display = timerEnable ? 'block' : 'none';
                if (!clockStarted) {
                    clockStarted = true;
                    const pad = x => x < 10 ? '0' + x : x;
                    const ticktock = () => {
                        const t = new Date();
                        clock.innerHTML = '🕒 ' + [pad(t.getHours()), pad(t.getMinutes())].join(':');
                    };
                    ticktock();
                    setInterval(ticktock, 1000);
                }
            }

            function fillForm(cfg) {
                document.getElementById('timer').checked = String(cfg.timerEnable) !== '0';
                document.getElementById('font').value = cfg.font || DEFAULTS.font;
                document.getElementById('font_color').value = cfg.font_color || DEFAULTS.font_color;
                document.getElementById('fontColorPicker').value = cfg.font_color || DEFAULTS.font_color;
                document.getElementById('size').value = cfg.size || DEFAULTS.size;
                document.getElementById('color').value = cfg.color || DEFAULTS.color;
                document.getElementById('colorPicker').value = cfg.color || DEFAULTS.color;
                document.getElementById('color_end').value = cfg.color_end || DEFAULTS.color_end;
                document.getElementById('colorEndPicker').value = cfg.color_end || DEFAULTS.color_end;
                document.getElementById('scrollamount').value = cfg.scrollamount || DEFAULTS.scrollamount;

                setSelectValue('position', cfg.position || DEFAULTS.position);
                setSelectValue('direction', cfg.direction || DEFAULTS.direction);
                setSelectValue('angle', cfg.angle || DEFAULTS.angle);
                setSelectValue('transparent', cfg.transparent || DEFAULTS.transparent);

                document.getElementById('text-list').innerHTML = '';
                const messages = (cfg.text || DEFAULTS.text).replace(/%5BBR%5D/gi, '[BR]').split('[BR]');
                messages.forEach(msg => addTextRow(msg));
            }

            function readForm() {
                const inputs = [...document.querySelectorAll('#text-list input[name="text-pre[]"]')];
                return {
                    text: inputs.map(i => i.value).join('[BR]'),
                    timerEnable: document.getElementById('timer').checked ? '1' : '0',
                    font: document.getElementById('font').value,
                    font_color: document.getElementById('font_color').value,
                    size: document.getElementById('size').value,
                    color: document.getElementById('color').value,
                    color_end: document.getElementById('color_end').value,
                    angle: document.getElementById('angle').value,
                    scrollamount: document.getElementById('scrollamount').value,
                    direction: document.getElementById('direction').value,
                    transparent: document.getElementById('transparent').value,
                    position: document.getElementById('position').value
                };
            }

            function buildLegacyUrl(cfg) {
                const url = new URL(location.href.split('?')[0]);
                Object.keys(DEFAULTS).forEach(key => url.searchParams.set(key, cfg[key]));
                url.searchParams.set('obs', '1');
                return url.toString();
            }

            const sync = new NekoSync('obs-marquee', { defaults: DEFAULTS, schemaVersion: 1 });
            let config = sync.init();
            const legacy = getLegacyUrlParams();
            if (sync.migrateFromLegacyIfEmpty(legacy)) config = sync.loadLocal();

            applyConfig(config);

            if (!isOBS) {
                document.body.setAttribute('data-bs-theme', 'dark');
                document.getElementById('content').style.display = '';

                fillForm(config);
                document.getElementById('preview').value = buildLegacyUrl(config);
                document.getElementById('obsUrl').value = sync.buildObsSourceUrl();
                NekoMask.attach(document.getElementById('obsUrl'), document.getElementById('toggleObsUrl'));

                document.getElementById('add-text').addEventListener('click', () => addTextRow(''));

                document.getElementById('text-list').addEventListener('click', e => {
                    const btn = e.target.closest('button[data-del]');
                    if (btn) btn.closest('.input-group').remove();
                });

                document.getElementById('fontColorPicker').addEventListener('input', e => {
                    document.getElementById('font_color').value = e.target.value;
                });
                document.getElementById('colorPicker').addEventListener('input', e => {
                    document.getElementById('color').value = e.target.value;
                });
                document.getElementById('colorEndPicker').addEventListener('input', e => {
                    document.getElementById('color_end').value = e.target.value;
                });

                document.getElementById('btn-generate').addEventListener('click', function () {
                    config = sync.save(readForm());
                    document.getElementById('preview').value = buildLegacyUrl(config);
                });

                document.getElementById('copyObsUrl').addEventListener('click', function () {
                    const input = document.getElementById('obsUrl');
                    input.select();
                    try { navigator.clipboard.writeText(input.value); } catch (e) { document.execCommand('copy'); }
                    this.textContent = '已複製！';
                    setTimeout(() => { this.textContent = '複製'; }, 1500);
                });

                document.getElementById('preview').addEventListener('click', function () {
                    this.select();
                    document.execCommand('copy');
                    this.classList.add('is-valid');
                    setTimeout(() => this.classList.remove('is-valid'), 3000);
                });

                NekoSyncPanel.mount(document.getElementById('syncPanelMount'), sync);
            }

            sync.onChange((newConfig, source) => {
                config = newConfig;
                applyConfig(config);
                if (!isOBS && source === 'remote') {
                    fillForm(config);
                    document.getElementById('preview').value = buildLegacyUrl(config);
                }
            });
        </script>

    </body>

</html>
