<!DOCTYPE html>
<html lang="zh-tw">

    <head>
        <title>OBS 輸入中樣式跑馬燈 ◃ 網頁小工具 😺 tools.nekolive.net</title>
        <meta name="robots" content="noindex, nofollow" />
        <meta name="author" content="猫又おにぎり (https://haer0248.me/)" />

        <meta charset="utf-8" />
        <meta name="theme-color" content="#91beff" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />

        <link rel="icon" href="https://haer0248.me/favicon.ico" />
        <link rel="shortcut icon" href="https://haer0248.me/favicon.ico" />

        <link rel="stylesheet" href="https://widgets.nekolive.net/assets/bootstrap.min.css">
    </head>

    <body data-bs-theme="dark">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap');

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-size: 50px;
                font-family: 'Noto Sans TC', sans-serif;
                color: #FFFFFF;
            }

            .hidden {
                opacity: 0;
            }

            .console-underscore {
                display: inline-block;
                position: relative;
                left: -1px;
                color: #FFFFFF;
            }

            #content {
                font-family: 'Noto Sans TC', sans-serif;
                font-size: 16px;
            }
        </style>

        <span id="text"></span>
        <div class="console-underscore" id="console">_</div>

        <div class="container mb-3" id="content">
            <div class="card">
                <div class="card-body">
                    <div class="alert alert-info">【幫助模式】幫助模式已自動啟用，在 OBS 使用此幫助將會自動隱藏，無需輸入任何設定。</div>

                    <form id="obsForm">
                        <div class="mb-3">
                            <label for="text" class="form-label">文字</label>
                            <p class="form-text">設定已改用雲端/本機儲存，不再受網址長度限制。</p>
                            <div id="text-list">
                                <div class="input-group mb-1" data-id="0">
                                    <input type="text" id="text-pre[]" name="text-pre[]" class="form-control" placeholder="預設文字" value="預設文字。">
                                    <button class="btn btn-outline-danger del-text" type="button" data-id="0">刪除</button>
                                </div>
                                <div class="input-group mb-1" data-id="1">
                                    <input type="text" id="text-pre[]" name="text-pre[]" class="form-control" placeholder="預設文字" value="第二行">
                                    <button class="btn btn-outline-danger del-text" type="button" data-id="1">刪除</button>
                                </div>
                                <div class="input-group mb-1" data-id="2">
                                    <input type="text" id="text-pre[]" name="text-pre[]" class="form-control" placeholder="預設文字" value="更多行">
                                    <button class="btn btn-outline-danger del-text" type="button" data-id="2">刪除</button>
                                </div>
                            </div>
                                <button class="btn btn-outline-success btn-sm" type="button" id="add-text">新增</button>
                        </div>

                        <div class="mb-3">
                            <label for="color" class="form-label">顏色</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                    <input type="color" class="form-control form-control-color" id="colorPicker" value="#FFFFFF">
                                </span>
                                <input type="text" class="form-control" placeholder="#FFFFFF" id="color" name="color" value="#FFFFFF">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="font" class="form-label">字體</label>
                            <input type="text" class="form-control" id="font" name="font" value="'Noto Sans TC', sans-serif" placeholder="'Noto Sans TC', sans-serif">
                            <p class="form-text">您的電腦中必須要有字體檔案。</p>
                        </div>

                        <div class="mb-3">
                            <label for="size" class="form-label">大小</label>
                            <input type="number" class="form-control" id="size" name="size" value="60" placeholder="60">
                            <p class="form-text">請在 OBS 設定長寬，並檢視預覽</p>
                        </div>

                        <div class="mb-3">
                            <label for="sec" class="form-label">換行秒數</label>
                            <input type="number" class="form-control" id="sec" name="sec" value="1" placeholder="1">
                        </div>

                        <button type="button" data-submit class="btn btn-success">儲存並套用設定</button>
                        <p class="form-text">按下後畫面預覽會立即更新；如果已經設定雲端同步，OBS 裡的來源畫面也會同步更新，不需要重新貼網址。</p>

                        <div class="mb-3">
                            <label for="obsUrl" class="form-label">OBS 瀏覽器來源網址（只需要貼一次）</label>
                            <div class="input-group">
                                <input type="text" class="form-control" readonly id="obsUrl">
                                <button class="btn btn-outline-secondary" type="button" id="toggleObsUrl">顯示</button>
                                <button class="btn btn-outline-secondary" type="button" id="copyObsUrl">複製</button>
                            </div>
                        </div>

                        <details class="mb-3">
                            <summary class="form-text" style="cursor:pointer;">進階：沒有設定雲端同步？改用傳統網址參數</summary>
                            <p class="form-text mt-2">傳統網址參數（受瀏覽器 <code>2,048</code> 字元長度限制）：</p>
                            <textarea class="form-control" readonly name="preview" id="preview" cols="30" rows="3"></textarea>
                        </details>

                        <div id="syncPanelMount"></div>
                    </form>
                </div>
            </div>
        </div>

        <script src="/static/shared/sync-server-config.js"></script>
        <script src="/static/shared/sync-store.js"></script>
        <script src="/static/shared/sync-panel.js"></script>

        <script>
            const DEFAULTS = {
                text: '預設文字。[BR]第二行[BR]更多行',
                font: "'Noto Sans TC', sans-serif",
                size: '60',
                color: '#FFFFFF',
                sec: '1'
            };

            function getLegacyUrlParams() {
                const params = new URLSearchParams(window.location.search);
                const out = {};
                let has = false;
                ['text', 'font', 'size', 'color', 'sec'].forEach(key => {
                    if (params.has(key)) { out[key] = params.get(key); has = true; }
                });
                return has ? out : null;
            }

            function isOBSMode() {
                return navigator.userAgent.includes('OBS') || new URLSearchParams(window.location.search).get('obs') === '1';
            }

            const sync = new NekoSync('obs-typing-marquee', { defaults: DEFAULTS, schemaVersion: 1 });
            let config = sync.init();
            const legacy = getLegacyUrlParams();
            if (sync.migrateFromLegacyIfEmpty(legacy)) config = sync.loadLocal();

            let typeInterval = null;
            let blinkInterval = null;

            function startConsole(words, secStr) {
                const seconds = parseInt(secStr) || 1;
                const con = document.getElementById('console');
                const target = document.getElementById('text');
                let letterCount = 1;
                let x = 1;
                let waiting = false;

                typeInterval = window.setInterval(function () {
                    if (letterCount === 0 && waiting === false) {
                        waiting = true;
                        target.textContent = words[0].substring(0, letterCount);
                        window.setTimeout(function () {
                            const usedWord = words.shift();
                            words.push(usedWord);
                            x = 1;
                            letterCount += x;
                            waiting = false;
                        }, 1000);
                    } else if (letterCount === words[0].length + 1 && waiting === false) {
                        waiting = true;
                        window.setTimeout(function () {
                            x = -1;
                            letterCount += x;
                            waiting = false;
                        }, seconds * 1000);
                    } else if (waiting === false) {
                        target.textContent = words[0].substring(0, letterCount);
                        letterCount += x;
                    }
                }, 60);

                let visible = true;
                blinkInterval = window.setInterval(function () {
                    if (visible === true) {
                        con.className = 'console-underscore hidden';
                        visible = false;
                    } else {
                        con.className = 'console-underscore';
                        visible = true;
                    }
                }, 400);
            }

            function applyConfig(cfg) {
                const color = cfg.color ? cfg.color.replace('%23', '') : '#FFFFFF';
                const font = cfg.font ? (cfg.font.startsWith('"') || cfg.font.startsWith("'") ? cfg.font : `"${cfg.font}"`) : "'Noto Sans TC', sans-serif";

                document.querySelector('.console-underscore').style.color = color;
                document.body.style.fontSize = (cfg.size || '60') + 'px';
                document.body.style.fontFamily = font;
                document.body.style.color = color;

                if (typeInterval) clearInterval(typeInterval);
                if (blinkInterval) clearInterval(blinkInterval);

                const text = (cfg.text || DEFAULTS.text).replace(/%5BBR%5D/g, '[BR]');
                const words = text.split('[BR]');
                startConsole(words, cfg.sec);
            }

            if (isOBSMode()) {
                document.getElementById('content').style.display = 'none';
                document.body.removeAttribute('data-bs-theme');
            }

            applyConfig(config);
            sync.onChange((newConfig) => {
                config = newConfig;
                applyConfig(config);
                if (!isOBSMode()) {
                    fillForm(config);
                    updatePreviews();
                }
            });

            function fillForm(cfg) {
                const textList = document.getElementById('text-list');
                textList.innerHTML = '';
                const messages = (cfg.text || DEFAULTS.text).replace(/%5BBR%5D/g, '[BR]').split('[BR]');
                messages.forEach((msg, i) => {
                    const div = document.createElement('div');
                    div.className = 'input-group mb-1';
                    div.setAttribute('data-id', i);
                    div.innerHTML = `
                        <input type="text" id="text-pre[]" name="text-pre[]" class="form-control" placeholder="預設文字" value="${msg}">
                        <button class="btn btn-outline-danger del-text" type="button" data-id="${i}">刪除</button>
                    `;
                    textList.appendChild(div);
                });
                textList._nextId = messages.length;

                document.getElementById('font').value = cfg.font || DEFAULTS.font;
                document.getElementById('size').value = cfg.size || DEFAULTS.size;
                document.getElementById('color').value = cfg.color || DEFAULTS.color;
                document.getElementById('colorPicker').value = cfg.color || DEFAULTS.color;
                document.getElementById('sec').value = cfg.sec || DEFAULTS.sec;
            }

            function readForm() {
                const inputs = document.querySelectorAll('input[name="text-pre[]"]');
                const convertedString = Array.from(inputs).map(i => i.value).join('[BR]');
                return {
                    text: convertedString,
                    font: document.getElementById('font').value,
                    size: document.getElementById('size').value,
                    color: document.getElementById('color').value,
                    sec: document.getElementById('sec').value
                };
            }

            function buildLegacyUrl(cfg) {
                let url = `https://${location.hostname}/obs?`;
                url += `text=${encodeURIComponent(cfg.text)}`;
                url += `&font=${encodeURIComponent(cfg.font)}`;
                url += `&size=${cfg.size}`;
                url += `&color=${encodeURIComponent(cfg.color)}`;
                url += `&sec=${cfg.sec}`;
                url += `&obs=1`;
                return url;
            }

            function updatePreviews() {
                document.getElementById('preview').value = buildLegacyUrl(readForm());
                document.getElementById('obsUrl').value = sync.buildObsSourceUrl();
                NekoMask.attach(document.getElementById('obsUrl'), document.getElementById('toggleObsUrl'));
            }

            if (!isOBSMode()) {
                fillForm(config);
                updatePreviews();

                document.getElementById('colorPicker').addEventListener('change', function () {
                    document.getElementById('color').value = this.value;
                });

                document.getElementById('add-text').addEventListener('click', function () {
                    const textList = document.getElementById('text-list');
                    const nextId = textList._nextId || textList.querySelectorAll('[data-id]').length;
                    const div = `
                        <div class="input-group mb-1" data-id="${nextId}">
                            <input type="text" id="text-pre[]" name="text-pre[]" class="form-control" placeholder="預設文字">
                            <button class="btn btn-outline-danger del-text" type="button" data-id="${nextId}">刪除</button>
                        </div>`;
                    textList.insertAdjacentHTML('beforeend', div);
                    textList._nextId = nextId + 1;
                });

                document.addEventListener('click', function (e) {
                    if (e.target.classList.contains('del-text')) {
                        const id = e.target.getAttribute('data-id');
                        document.querySelector(`div[data-id="${id}"]`).remove();
                    }
                });

                document.querySelector('button[data-submit]').addEventListener('click', function () {
                    config = sync.save(readForm());
                    updatePreviews();
                });

                document.getElementById('copyObsUrl').addEventListener('click', function () {
                    const input = document.getElementById('obsUrl');
                    input.select();
                    try { navigator.clipboard.writeText(input.value); } catch (e) { document.execCommand('copy'); }
                    this.textContent = '已複製！';
                    setTimeout(() => { this.textContent = '複製'; }, 1500);
                });

                document.getElementById('preview').addEventListener('click', function () {
                    this.select();
                    document.execCommand('copy');
                    this.classList.add('is-valid');
                    setTimeout(() => { this.className = 'form-control'; }, 3000);
                });

                NekoSyncPanel.mount(document.getElementById('syncPanelMount'), sync);
            }
        </script>

            function gtag() { dataLayer.push(arguments); }
            gtag('js', new Date());

            gtag('config', 'G-E5D30J36L6');
        </script>
    </body>

</html>
