<html lang="zh-TW">

    <body>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap');
            
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                font-family: 'Noto Sans TC', sans-serif;
            }

            .box {
                display: block;
                left: 0;
                top: 0;
                position: absolute;
            }

            .context {
                background-color: rgba(0, 0, 0, var(--opacity, 0.9));
                font-size: var(--font-size, 5rem);
                color: var(--font-color, #ffffff);
                text-shadow:
                    var(--outline-color, #000000) 2px 0px 0px,
                    var(--outline-color, #000000) 1.75517px 0.958851px 0px,
                    var(--outline-color, #000000) 1.0806px 1.68294px 0px,
                    var(--outline-color, #000000) 0.141474px 1.99499px 0px,
                    var(--outline-color, #000000) -0.832294px 1.81859px 0px,
                    var(--outline-color, #000000) -1.60229px 1.19694px 0px,
                    var(--outline-color, #000000) -1.97999px 0.28224px 0px,
                    var(--outline-color, #000000) -1.87291px -0.701566px 0px,
                    var(--outline-color, #000000) -1.30729px -1.51361px 0px,
                    var(--outline-color, #000000) -0.421592px -1.95506px 0px,
                    var(--outline-color, #000000) 0.567324px -1.91785px 0px,
                    var(--outline-color, #000000) 1.41734px -1.41108px 0px,
                    var(--outline-color, #000000) 1.92034px -0.558831px 0px;
            }
        </style>

        <div class="box">
            <span class="context" id="text">吃晚餐</span>
        </div>

        <div class="container" id="obsHide" style="display: none;">
            <div class="card">
                <div class="card-body">
                    <div class="alert alert-info">
                        【幫助模式】幫助模式已自動啟用，在 OBS 使用此幫助將會自動隱藏，無需輸入任何設定。
                    </div>

                    <form action="#!" method="get" id="form">

                        <div class="mb-3">
                            <label for="text" class="form-label">顯示文字</label>
                            <input type="text" class="form-control" id="text" name="text" placeholder="吃晚餐">
                        </div>

                        <div class="mb-3">
                            <label for="color" class="form-label">文字顏色</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                    <input type="color" class="form-control form-control-color" id="colorPicker" data-bind="fontColor">
                                </span>
                                <input type="text" class="form-control" id="fontColor" name="fontColor">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="fontSize" class="form-label">文字大小</label>
                            <input type="text" class="form-control" id="fontSize" name="fontSize" placeholder="5rem">
                            <p class="form-text">預設 5rem，請輸入單位 <code>px</code>, <code>em</code>, <code>rem</code> 或使用 <code>%</code></p>
                        </div>

                        <div class="mb-3">
                            <label for="color" class="form-label">邊框顏色</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                    <input type="color" class="form-control form-control-color" id="colorPicker" data-bind="outlineColor">
                                </span>
                                <input type="text" class="form-control" id="outlineColor" name="outlineColor">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="outlineSize" class="form-label">邊框大小</label>
                            <input type="text" class="form-control" id="outlineSize" name="outlineSize" placeholder="3">
                            <p class="form-text">預設 3</p>
                        </div>

                        <div class="mb-3">
                            <label for="speed" class="form-label">速度</label>
                            <div class="d-flex justify-content-between">
                                <div>0</div>
                                <div>100</div>
                                <div>200</div>
                                <div>300</div>
                                <div>400</div>
                                <div>500</div>
                                <div>600</div>
                                <div>700</div>
                                <div>800</div>
                                <div>900</div>
                                <div>1000</div>
                            </div>
                            <input id="speed" name="speed" type="range" class="form-range" min="0" max="1000" value="300">
                            <p class="form-text">預設 300</p>
                        </div>

                        <div class="mb-3">
                            <label for="opacity" class="form-label">背景不透明度</label>
                            <div class="d-flex justify-content-between">
                                <div>0%</div>
                                <div>10%</div>
                                <div>20%</div>
                                <div>30%</div>
                                <div>40%</div>
                                <div>50%</div>
                                <div>60%</div>
                                <div>70%</div>
                                <div>80%</div>
                                <div>90%</div>
                                <div>100%</div>
                            </div>
                            <input id="opacity" name="opacity" type="range" class="form-range" min="0" max="100" value="90">
                            <p class="form-text">預設 90%</p>
                        </div>
                    </form>

                    <button type="button" data-submit class="btn btn-success">儲存並套用設定</button>
                    <p class="form-text">按下後畫面預覽會立即更新；如果已經設定雲端同步，OBS 裡的來源畫面也會同步更新，不需要重新貼網址。</p>

                    <div class="mb-3">
                        <label for="obsUrl" class="form-label">OBS 瀏覽器來源網址（只需要貼一次）</label>
                        <div class="input-group">
                            <input type="text" class="form-control" readonly id="obsUrl">
                            <button class="btn btn-outline-secondary" type="button" id="toggleObsUrl">顯示</button>
                            <button class="btn btn-outline-secondary" type="button" id="copyObsUrl">複製</button>
                        </div>
                    </div>

                    <details class="mb-3">
                        <summary class="form-text" style="cursor:pointer;">進階：沒有設定雲端同步？改用傳統網址參數</summary>
                        <p class="form-text mt-2">傳統網址參數（受瀏覽器 <code>2,048</code> 字元長度限制）：</p>
                        <textarea class="form-control" readonly name="preview" id="preview" cols="30" rows="3"></textarea>
                    </details>

                    <div id="syncPanelMount"></div>

                    <script>
                        $(document).on('change', "[id=colorPicker]", function () {
                            let bind = $(this).attr('data-bind');
                            $(`input[id=${bind}]`).val($(this).val());
                        });
                    </script>
                </div>
            </div>
        </div>

        <script>
            (function ($, window, undefined) {
                $.fn.marqueeify = function (options) {
                    var settings = $.extend({
                        horizontal: true,
                        vertical: true,
                        speed: 100,
                        container: $(this).parent(),
                        bumpEdge: function () { }
                    }, options);

                    return this.each(function () {
                        var containerWidth, containerHeight, elWidth, elHeight, move, getSizes,
                            $el = $(this);

                        getSizes = function () {
                            containerWidth = settings.container.outerWidth();
                            containerHeight = settings.container.outerHeight();
                            elWidth = $el.outerWidth();
                            elHeight = $el.outerHeight();
                        };

                        move = {
                            right: function () {
                                $el.animate({
                                    left: (containerWidth - elWidth)
                                }, {
                                    duration: ((containerWidth / settings.speed) * 1000),
                                    queue: false,
                                    easing: "linear",
                                    complete: function () {
                                        settings.bumpEdge();
                                        move.left();
                                    }
                                });
                            },
                            left: function () {
                                $el.animate({
                                    left: 0
                                }, {
                                    duration: ((containerWidth / settings.speed) * 1000),
                                    queue: false,
                                    easing: "linear",
                                    complete: function () {
                                        settings.bumpEdge();
                                        move.right();
                                    }
                                });
                            },
                            down: function () {
                                $el.animate({
                                    top: (containerHeight - elHeight)
                                }, {
                                    duration: ((containerHeight / settings.speed) * 1000),
                                    queue: false,
                                    easing: "linear",
                                    complete: function () {
                                        settings.bumpEdge();
                                        move.up();
                                    }
                                });
                            },
                            up: function () {
                                $el.animate({
                                    top: 0
                                }, {
                                    duration: ((containerHeight / settings.speed) * 1000),
                                    queue: false,
                                    easing: "linear",
                                    complete: function () {
                                        settings.bumpEdge();
                                        move.down();
                                    }
                                });
                            }
                        };

                        getSizes();

                        if (settings.horizontal) {
                            move.right();
                        }
                        if (settings.vertical) {
                            move.down();
                        }

                        $(window).resize(function () {
                            getSizes();
                        });
                    });
                };
            })(jQuery, window);
        </script>

        <script src="/static/shared/sync-server-config.js"></script>
        <script src="/static/shared/sync-store.js"></script>
        <script src="/static/shared/sync-panel.js"></script>

        <script>
            function detectOBS() {
                const userAgent = navigator.userAgent.toLowerCase();
                const hasOBSInUA = userAgent.includes('obs');
                const hasOBSWindow = typeof window.obsstudio !== 'undefined';
                return hasOBSInUA || hasOBSWindow;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const isOBSMode = detectOBS() || urlParams.get('obs') === '1';

            const DEFAULTS = {
                text: '吃晚餐',
                fontColor: '#ffffff',
                fontSize: '5rem',
                outlineColor: '#000000',
                outlineSize: '3',
                speed: '300',
                opacity: '90'
            };

            function getLegacyUrlParams() {
                const out = {};
                let has = false;
                ['text', 'fontColor', 'fontSize', 'outlineColor', 'outlineSize', 'speed', 'opacity'].forEach(key => {
                    if (urlParams.has(key)) { out[key] = urlParams.get(key); has = true; }
                });
                return has ? out : null;
            }

            const sync = new NekoSync('obs-dvd', { defaults: DEFAULTS, schemaVersion: 1 });
            let config = sync.init();
            const legacy = getLegacyUrlParams();
            if (sync.migrateFromLegacyIfEmpty(legacy)) config = sync.loadLocal();

            if (isOBSMode) {
                const styleElement = document.createElement('style');
                styleElement.type = 'text/css';
                styleElement.textContent = `
                html,
                body {
                    height: 100%;
                    margin: 0;
                    min-height: 100%;
                    overflow: hidden;
                    position: relative;
                }`;
                document.head.appendChild(styleElement);
            } else {
                const styleElement = document.createElement('style');
                styleElement.type = 'text/css';
                styleElement.textContent = `
                html,
                body {
                    background-color: #6c6c6c;
                }`;
                document.head.appendChild(styleElement);
            }

            let marqueeRunning = false;

            function applyConfig(cfg) {
                const root = document.documentElement;
                document.getElementById('text').innerText = cfg.text;
                root.style.setProperty('--font-color', cfg.fontColor);
                root.style.setProperty('--font-size', cfg.fontSize);
                root.style.setProperty('--outline-color', cfg.outlineColor);
                root.style.setProperty('--opacity', (cfg.opacity / 100));

                const context = document.querySelector('.context');
                Outline.update(context, cfg.outlineSize, cfg.outlineColor);

                if (isOBSMode) {
                    if (marqueeRunning) {
                        $('.box').stop(true, false);
                    }
                    marqueeRunning = true;
                    $('.box').marqueeify({ speed: cfg.speed });
                }
            }

            function fillForm(cfg) {
                document.getElementById('text').value = cfg.text;
                document.getElementById('fontColor').value = cfg.fontColor;
                document.getElementById('fontSize').value = cfg.fontSize;
                document.getElementById('outlineColor').value = cfg.outlineColor;
                document.getElementById('outlineSize').value = cfg.outlineSize;
                document.getElementById('speed').value = cfg.speed;
                document.getElementById('opacity').value = cfg.opacity;
            }

            function readForm() {
                return {
                    text: document.getElementById('text').value,
                    fontColor: document.getElementById('fontColor').value,
                    fontSize: document.getElementById('fontSize').value,
                    outlineColor: document.getElementById('outlineColor').value,
                    outlineSize: document.getElementById('outlineSize').value,
                    speed: document.getElementById('speed').value,
                    opacity: document.getElementById('opacity').value
                };
            }

            function buildLegacyUrl(cfg) {
                const params = new URLSearchParams();
                Object.keys(cfg).forEach(k => params.append(k, cfg[k]));
                params.append('obs', '1');
                return `https://${location.hostname}/obs_dvd?${params.toString()}`;
            }

            $(document).ready(function () {
                if (isOBSMode) {
                    document.getElementById('obsHide').style.display = 'none';
                    applyConfig(config);
                } else {
                    document.getElementById('obsHide').style.display = 'block';
                    fillForm(config);
                    document.getElementById('preview').value = buildLegacyUrl(config);
                    document.getElementById('obsUrl').value = sync.buildObsSourceUrl();
                    NekoMask.attach(document.getElementById('obsUrl'), document.getElementById('toggleObsUrl'));

                    $(document).on('click', 'button[data-submit]', function () {
                        config = sync.save(readForm());
                        document.getElementById('preview').value = buildLegacyUrl(config);
                    });

                    $(document).on('click', '#preview', function () {
                        this.select();
                        document.execCommand('copy');
                        $(this).addClass('is-valid');
                        setTimeout(() => { $('#preview').attr('class', 'form-control'); }, 3000);
                    });

                    document.getElementById('copyObsUrl').addEventListener('click', function () {
                        const input = document.getElementById('obsUrl');
                        input.select();
                        try { navigator.clipboard.writeText(input.value); } catch (e) { document.execCommand('copy'); }
                        this.textContent = '已複製！';
                        setTimeout(() => { this.textContent = '複製'; }, 1500);
                    });

                    NekoSyncPanel.mount(document.getElementById('syncPanelMount'), sync);
                }

                sync.onChange((newConfig, source) => {
                    config = newConfig;
                    applyConfig(config);
                    if (!isOBSMode && source === 'remote') {
                        fillForm(config);
                        document.getElementById('preview').value = buildLegacyUrl(config);
                    }
                });
            });
        </script>
