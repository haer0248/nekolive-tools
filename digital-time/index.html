<!DOCTYPE html>
<html lang="zh-TW">

    <head>
        <title>時鐘-七段顯示器 ◃ 網頁小工具 😺 tools.nekolive.net</title>
        <meta name="robots" content="noindex, nofollow" />
        <meta name="author" content="猫又おにぎり (https://haer0248.me/)" />

        <meta charset="utf-8" />
        <meta name="theme-color" content="#91beff" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />

        <link rel="icon" href="https://haer0248.me/favicon.ico" />
        <link rel="shortcut icon" href="https://haer0248.me/favicon.ico" />

        <link rel="stylesheet" href="https://widgets.nekolive.net/assets/bootstrap.min.css" />

        <style>
            :root {
                --off: rgba(157, 158, 160, 0.1);
                --on: rgb(145, 190, 255);
                --on-glow: rgba(145, 190, 255, 0.65);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
                background: transparent;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
            }

            .wrap {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 28px;
            }

            .clock {
                display: flex;
                align-items: center;
            }

            .digit-group {
                display: flex;
                overflow: hidden;
                transition: max-width 0.4s ease, opacity 0.35s ease, margin 0.4s ease, transform 0.35s ease;
                max-width: 160px;
            }

            .digit-group.hidden {
                max-width: 0;
                opacity: 0;
                transform: scale(0.85);
                margin: 0;
            }

            .digit {
                position: relative;
                width: 54px;
                height: 96px;
                margin: 0 6px;
            }

            .segment {
                position: absolute;
                background: var(--off);
                transition: background-color 0.15s ease, box-shadow 0.15s ease;
            }

            .segment.on {
                background: var(--on);
                box-shadow: 0 0 10px 1px var(--on-glow);
            }

            .seg-h {
                left: 7px;
                width: 40px;
                height: 9px;
                clip-path: polygon(12% 0%, 88% 0%, 100% 50%, 88% 100%, 12% 100%, 0% 50%);
            }

            .seg-a {
                top: 0;
            }

            .seg-g {
                top: 43.5px;
            }

            .seg-d {
                bottom: 0;
            }

            .seg-v {
                width: 9px;
                height: 39px;
                clip-path: polygon(0% 12%, 50% 0%, 100% 12%, 100% 88%, 50% 100%, 0% 88%);
            }

            .seg-f {
                top: 6px;
                left: 0;
            }

            .seg-b {
                top: 6px;
                right: 0;
            }

            .seg-e {
                bottom: 6px;
                left: 0;
            }

            .seg-c {
                bottom: 6px;
                right: 0;
            }

            .colon {
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 14px;
                width: 20px;
                margin: 0 2px;
                transition: max-width 0.4s ease, opacity 0.35s ease, margin 0.4s ease;
            }

            .colon.hidden {
                max-width: 0;
                opacity: 0;
                margin: 0;
                overflow: hidden;
            }

            .colon-dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: var(--off);
                margin: 0 auto;
                transition: background-color 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
            }

            .colon-dot.on {
                background: var(--on);
                box-shadow: 0 0 10px 1px var(--on-glow);
            }

            #color-panel {
                position: fixed;
                right: 16px;
                bottom: 16px;
                z-index: 999;
                width: 300px;
                max-height: calc(100vh - 32px);
                overflow-y: auto;
                padding: 16px;
                border-radius: 12px;
                background: rgba(20, 20, 24, 0.92);
                color: #e8e8ec;
                font-size: 13px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                display: none;
            }

            #color-panel.visible {
                display: block;
            }

            #color-panel h2 {
                margin: 0 0 12px;
                font-size: 14px;
                font-weight: 600;
            }

            #color-panel .row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 10px;
                gap: 10px;
            }

            #color-panel label {
                flex: 1;
            }

            #color-panel input[type="color"] {
                width: 40px;
                height: 26px;
                padding: 0;
                border: none;
                border-radius: 6px;
                background: none;
                cursor: pointer;
            }

            #color-panel input[type="checkbox"] {
                width: 16px;
                height: 16px;
                cursor: pointer;
            }

            #color-panel input[type="range"] {
                width: 110px;
                cursor: pointer;
            }

            #color-panel .value-tag {
                width: 32px;
                text-align: right;
                font-variant-numeric: tabular-nums;
                color: #aaa;
            }

            #color-panel .url-box {
                margin-top: 10px;
            }

            #color-panel textarea {
                width: 100%;
                height: 56px;
                resize: none;
                font-size: 11px;
                font-family: monospace;
                background: #0e0e11;
                color: #b7f7c8;
                border: 1px solid #333;
                border-radius: 6px;
                padding: 6px;
                box-sizing: border-box;
            }

            #color-panel .url-box input[type="text"],
            #color-panel .url-box input[type="password"] {
                width: 100%;
                font-size: 11px;
                font-family: monospace;
                background: #0e0e11;
                border: 1px solid #333;
                border-radius: 6px;
                padding: 6px;
                box-sizing: border-box;
                margin-bottom: 4px;
            }

            #color-panel button {
                margin-top: 8px;
                width: 100%;
                padding: 7px;
                border: none;
                border-radius: 6px;
                background: #4c8dff;
                color: #fff;
                font-size: 12px;
                cursor: pointer;
            }

            #color-panel button:active {
                opacity: 0.8;
            }

            #color-panel .hint {
                margin-top: 8px;
                font-size: 11px;
                color: #999;
                line-height: 1.4;
            }
        </style>
    </head>

    <body>

        <div class="wrap">
            <div class="clock" id="clock">
                <div class="digit-group" id="group-hh">
                    <div class="digit" data-digit></div>
                    <div class="digit" data-digit></div>
                </div>

                <div class="colon" id="colon-1">
                    <div class="colon-dot"></div>
                    <div class="colon-dot"></div>
                </div>

                <div class="digit-group" id="group-mm">
                    <div class="digit" data-digit></div>
                    <div class="digit" data-digit></div>
                </div>

                <div class="colon" id="colon-2">
                    <div class="colon-dot"></div>
                    <div class="colon-dot"></div>
                </div>

                <div class="digit-group" id="group-ss">
                    <div class="digit" data-digit></div>
                    <div class="digit" data-digit></div>
                </div>
            </div>
        </div>

        <div id="color-panel">
            <h2>顯示設定</h2>
            <div class="row">
                <label for="p-seconds">顯示秒數</label>
                <input type="checkbox" id="p-seconds" />
            </div>
            <div class="row">
                <label for="p-on">亮燈顏色</label>
                <input type="color" id="p-on" />
            </div>
            <div class="row">
                <label for="p-off">未亮顏色</label>
                <input type="color" id="p-off" />
            </div>
            <div class="row">
                <label for="p-off-opacity">未亮不透明度</label>
                <input type="range" id="p-off-opacity" min="0" max="1" step="0.01" value="0.1" />
                <span class="value-tag" id="p-off-opacity-val">0.1</span>
            </div>
            <div class="url-box">
                <label style="display:block; margin-bottom:4px;">OBS 瀏覽器來源網址（只需要貼一次）</label>
                <input type="text" id="p-obs-url" readonly style="color:#9dd8ff; width:100%; box-sizing:border-box;">
                <button id="p-obs-toggle">顯示</button>
                <button id="p-obs-copy">複製</button>
            </div>
            <details style="margin-top:10px;">
                <summary style="cursor:pointer;">進階：沒有設定雲端同步？改用傳統網址參數</summary>
                <div class="url-box">
                    <textarea id="p-url" readonly></textarea>
                    <button id="p-copy">複製網址</button>
                </div>
            </details>
            <div class="hint">此面板只會在一般瀏覽器顯示，OBS 瀏覽器來源不會出現。已設定雲端同步的話，這裡改設定 OBS 端會即時套用，不用重貼網址。</div>
            <div id="syncPanelMount"></div>
        </div>

        <script src="/static/shared/sync-server-config.js"></script>
        <script src="/static/shared/sync-store.js"></script>
        <script src="/static/shared/sync-panel.js"></script>

        <script>
            const SEGMENT_MAP = {
                '0': 'abcdef',
                '1': 'bc',
                '2': 'abged',
                '3': 'abgcd',
                '4': 'fgbc',
                '5': 'afgcd',
                '6': 'afgedc',
                '7': 'abc',
                '8': 'abcdefg',
                '9': 'abcdfg'
            };
            const SEG_NAMES = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];

            function buildDigit(container) {
                SEG_NAMES.forEach(name => {
                    const el = document.createElement('div');
                    const isHorizontal = (name === 'a' || name === 'd' || name === 'g');
                    el.className = 'segment ' + (isHorizontal ? 'seg-h' : 'seg-v') + ' seg-' + name;
                    el.dataset.seg = name;
                    container.appendChild(el);
                });
            }

            function updateDigit(container, charDigit) {
                const on = new Set((SEGMENT_MAP[charDigit] || '').split(''));
                container.querySelectorAll('.segment').forEach(seg => {
                    seg.classList.toggle('on', on.has(seg.dataset.seg));
                });
            }

            document.querySelectorAll('.digit').forEach(buildDigit);

            const groups = {
                hh: [...document.querySelectorAll('#group-hh .digit')],
                mm: [...document.querySelectorAll('#group-mm .digit')],
                ss: [...document.querySelectorAll('#group-ss .digit')],
            };

            const groupSS = document.getElementById('group-ss');
            const colon2 = document.getElementById('colon-2');
            const root = document.documentElement.style;

            function normalizeColor(value) {
                if (!value) return null;
                const v = decodeURIComponent(value);
                return v.startsWith('#') || /^[a-z]+$/i.test(v) ? v : '#' + v;
            }

            const DEFAULTS = { seconds: 'false', color: '91beff', offColor: '9d9ea0', offOpacity: '0.1' };

            function getLegacyUrlParams() {
                const params = new URLSearchParams(window.location.search);
                const out = {};
                let has = false;
                if (params.has('seconds')) { out.seconds = ['1', 'true', 'yes'].includes((params.get('seconds') || '').toLowerCase()) ? 'true' : 'false'; has = true; }
                if (params.has('color')) { out.color = params.get('color'); has = true; }
                if (params.has('off-color')) { out.offColor = params.get('off-color'); has = true; }
                if (params.has('off-opacity')) { out.offOpacity = params.get('off-opacity'); has = true; }
                return has ? out : null;
            }

            function isOBSMode() {
                return typeof window.obsstudio !== 'undefined' || navigator.userAgent.includes('OBS') || new URLSearchParams(window.location.search).get('obs') === '1';
            }

            let showSeconds = false;

            function applyMode() {
                groupSS.classList.toggle('hidden', !showSeconds);
                colon2.classList.toggle('hidden', !showSeconds);
            }

            function applyConfig(cfg) {
                showSeconds = String(cfg.seconds) === 'true';
                const onColor = normalizeColor(cfg.color) || '#' + DEFAULTS.color;
                const offColor = normalizeColor(cfg.offColor) || '#' + DEFAULTS.offColor;
                const offOpacityParam = parseFloat(cfg.offOpacity);
                const offOpacity = Number.isFinite(offOpacityParam) ? Math.min(1, Math.max(0, offOpacityParam)) : 0.1;

                root.setProperty('--on', onColor);
                root.setProperty('--on-glow', onColor);
                root.setProperty('--off', hexToRgbA(offColor, offOpacity));
                applyMode();
            }

            function pad(n) {
                return n.toString().padStart(2, '0');
            }

            function hexToRgbA(hex, opacity = '0.1') {
                var c;
                if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
                    c = hex.substring(1).split('');
                    if (c.length == 3) {
                        c = [c[0], c[0], c[1], c[1], c[2], c[2]];
                    }
                    c = '0x' + c.join('');
                    return 'rgba(' + [(c >> 16) & 255, (c >> 8) & 255, c & 255].join(',') + ','+opacity+')';
                }
                throw new Error('Bad Hex:' + hex);
            }

            function renderClock() {
                const now = new Date();
                const hh = pad(now.getHours());
                const mm = pad(now.getMinutes());
                const ss = pad(now.getSeconds());

                updateDigit(groups.hh[0], hh[0]);
                updateDigit(groups.hh[1], hh[1]);
                updateDigit(groups.mm[0], mm[0]);
                updateDigit(groups.mm[1], mm[1]);
                updateDigit(groups.ss[0], ss[0]);
                updateDigit(groups.ss[1], ss[1]);
            }

            function renderColons() {
                const blinkOn = Math.floor(Date.now() / 500) % 2 === 0;
                document.querySelectorAll('.colon-dot').forEach(dot => {
                    dot.classList.toggle('on', blinkOn);
                });
            }

            renderClock();
            renderColons();
            setInterval(renderClock, 1000);
            setInterval(renderColons, 500);

            function rgbStringToHex(str) {
                const m = str.match(/\d+(\.\d+)?/g);
                if (!m) return '#000000';
                const [r, g, b] = m;
                return '#' + [r, g, b].map(n => Math.round(n).toString(16).padStart(2, '0')).join('');
            }

            const sync = new NekoSync('digital-time', { defaults: DEFAULTS, schemaVersion: 1 });
            let config = sync.init();
            const legacy = getLegacyUrlParams();
            if (sync.migrateFromLegacyIfEmpty(legacy)) config = sync.loadLocal();

            function buildLegacyUrl(cfg) {
                const u = new URL(window.location.href);
                u.search = '';
                if (String(cfg.seconds) === 'true') u.searchParams.set('seconds', '1');
                u.searchParams.set('color', String(cfg.color).replace('#', ''));
                u.searchParams.set('off-color', String(cfg.offColor).replace('#', ''));
                u.searchParams.set('off-opacity', cfg.offOpacity);
                u.searchParams.set('obs', '1');
                return u.toString();
            }

            function fillForm(cfg) {
                const inputSeconds = document.getElementById('p-seconds');
                const inputOn = document.getElementById('p-on');
                const inputOff = document.getElementById('p-off');
                const inputOffOpacity = document.getElementById('p-off-opacity');
                const offOpacityVal = document.getElementById('p-off-opacity-val');

                inputOn.value = normalizeColor(cfg.color) || '#' + DEFAULTS.color;
                inputOff.value = normalizeColor(cfg.offColor) || '#' + DEFAULTS.offColor;
                inputSeconds.checked = String(cfg.seconds) === 'true';
                inputOffOpacity.value = cfg.offOpacity;
                offOpacityVal.textContent = cfg.offOpacity;
            }

            function readForm() {
                const inputSeconds = document.getElementById('p-seconds');
                const inputOn = document.getElementById('p-on');
                const inputOff = document.getElementById('p-off');
                const inputOffOpacity = document.getElementById('p-off-opacity');
                return {
                    seconds: inputSeconds.checked ? 'true' : 'false',
                    color: inputOn.value,
                    offColor: inputOff.value,
                    offOpacity: inputOffOpacity.value
                };
            }

            applyConfig(config);

            if (!isOBSMode()) {
                const panel = document.getElementById('color-panel');
                const inputSeconds = document.getElementById('p-seconds');
                const inputOn = document.getElementById('p-on');
                const inputOff = document.getElementById('p-off');
                const inputOffOpacity = document.getElementById('p-off-opacity');
                const offOpacityVal = document.getElementById('p-off-opacity-val');
                const urlBox = document.getElementById('p-url');
                const copyBtn = document.getElementById('p-copy');
                const obsUrlBox = document.getElementById('p-obs-url');
                const obsCopyBtn = document.getElementById('p-obs-copy');
                const obsToggleBtn = document.getElementById('p-obs-toggle');

                fillForm(config);
                urlBox.value = buildLegacyUrl(config);
                obsUrlBox.value = sync.buildObsSourceUrl();
                NekoMask.attach(obsUrlBox, obsToggleBtn);

                function saveFromForm() {
                    config = sync.save(readForm());
                    urlBox.value = buildLegacyUrl(config);
                }

                inputOn.addEventListener('input', saveFromForm);
                inputOff.addEventListener('input', saveFromForm);
                inputOffOpacity.addEventListener('input', () => {
                    offOpacityVal.textContent = inputOffOpacity.value;
                    saveFromForm();
                });
                inputSeconds.addEventListener('change', saveFromForm);

                copyBtn.addEventListener('click', () => {
                    urlBox.select();
                    navigator.clipboard.writeText(urlBox.value).then(() => {
                        copyBtn.textContent = '已複製！';
                        setTimeout(() => (copyBtn.textContent = '複製網址'), 1200);
                    }).catch(() => {
                        document.execCommand('copy');
                    });
                });

                obsCopyBtn.addEventListener('click', () => {
                    obsUrlBox.select();
                    navigator.clipboard.writeText(obsUrlBox.value).then(() => {
                        obsCopyBtn.textContent = '已複製！';
                        setTimeout(() => (obsCopyBtn.textContent = '複製'), 1200);
                    }).catch(() => {
                        document.execCommand('copy');
                    });
                });

                NekoSyncPanel.mount(document.getElementById('syncPanelMount'), sync);

                panel.classList.add('visible');
            }

            sync.onChange((newConfig, source) => {
                config = newConfig;
                applyConfig(config);
                if (!isOBSMode() && source === 'remote') {
                    fillForm(config);
                    document.getElementById('p-url').value = buildLegacyUrl(config);
                }
            });
        </script>

    </body>

</html>
